# Qualification lanes: which suites run when, on a GPU box.
#
# gate     - every run, plain `cargo test --features cuda --release`
#            (a gate file may not contain #[ignore] tests).
# contract - before a release, after a kernel edit, after a merge:
#            the file's ignored arms run via `-- --ignored`.
# record   - manual instruments: benches, probes, censuses that need
#            foreign hardware or model assets. Never run automatically.
# host     - no GPU and no cuda feature needed; CI runs these.
#
# tests/qual_lane_census.rs enforces that this file and tests/ agree:
# a new suite must take a lane here in the same commit.

