# Qualification lanes: which suites run when, on a GPU box.
#
# gate          - every run, plain `cargo test --features cuda --release`
#                 (a gate file may not contain #[ignore] tests, except a child
#                 test a parent in the same file launches by itself, marked
#                 `#[ignore = "invoked by ..."]`).
# contract      - before a release, after a kernel edit, after a merge:
#                 the file's ignored arms run via `-- --ignored`.
# record        - manual instruments under tests/ that need foreign hardware
#                 or model assets. Never run automatically.
# host          - no GPU and no cuda feature needed; CI runs these.
# bench         - a `[[bench]]` target under benches/ with its own main
#                 (`cargo bench --bench <name>`); timing only, no verdict.
# qualification - a manual instrument under tools/qualification/, built only
#                 with `--features qualification` on a chosen board.
#
# tests/qual_lane_census.rs enforces that this file and the targets declared
# in Cargo.toml agree: a new target must take a lane here in the same commit.

