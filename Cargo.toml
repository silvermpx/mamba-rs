[package]
name = "mamba-rs"
version = "0.7.5"
edition = "2024"
rust-version = "1.97"
authors = ["silvermpx"]
description = "Mamba SSM and Mamba-3 SISO in Rust with optional CUDA acceleration: inference and training (BPTT through the SSM state, AdamW) on CPU and GPU, custom NVRTC-compiled kernels, CUDA Graph capture, f32 / bf16 / f16 storage, deterministic batch-invariant GEMMs by default with explicit cuBLAS Fast and Pedantic modes."
documentation = "https://docs.rs/mamba-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silvermpx/mamba-rs"
keywords = ["mamba", "ssm", "deep-learning", "cuda", "state-space-model"]
categories = ["science", "mathematics"]
# Test and bench targets are declared explicitly below: a file dropped into
# tests/ or benches/ does not become a target until it takes a lane in
# qual/lanes.toml (tests/qual_lane_census.rs checks that the manifest, the
# lane table and the files agree).
autotests = false
autobenches = false
# The published crate carries the library, kernels, examples, the declared
# regression tests with their fixtures, the benchmarks and the qualification
# tools. Measurement receipts, agent notes and local fleet configuration stay
# in the repository only.
exclude = [
    "internal/",
    ".flotilla.toml",
    ".idea/",
]

# docs.rs builds have no CUDA toolkit. An explicit cudarc version
# feature skips its nvcc probe and uses pregenerated bindings, so the
# whole CUDA surface - the determinism story included - renders there
# instead of staying invisible behind the feature gate. The pinned
# bindings version only shapes the docs build; runtime linking stays
# dynamic and version-probed.
[package.metadata.docs.rs]
features = ["cuda", "hf", "gemm-blas", "cli", "cudarc/cuda-12080"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "mamba-generate"
path = "src/bin/generate.rs"
required-features = ["cli"]

[[bin]]
name = "gemm-bi-tf32-qualification"
path = "src/bin/gemm_bi_tf32_qualification.rs"
required-features = ["qualification", "cuda"]

[features]
default = []
# half + bytemuck are needed by the cuda buffers (DtypedBuf bf16/f16 cast
# helpers); they must be in scope for `cargo build --features cuda` alone.
cuda = ["cudarc", "dep:half", "dep:bytemuck", "dep:sha2"]
cuda-cublaslt-qualification = ["cuda", "cudarc/cublaslt"]
# Distributed data-parallel over NCCL. The cudarc NCCL binding is pinned
# to one wire version explicitly; the crate-and-libnccl pair must move
# together (the same discipline as any native-library pair).
nccl = ["cuda", "cudarc/nccl-02030"]
accelerate = []
gemm-blas = ["gemm"]
hf = ["dep:half", "dep:bytemuck", "dep:serde", "dep:serde_json"]
cli = ["hf", "dep:clap", "dep:tokenizers", "dep:hf-hub"]
# Manual qualification instruments under tools/qualification (hardware,
# toolkit, NVRTC/SASS and admission-timing censuses) and the TF32
# qualification binary. Off by default: they are run by hand on a chosen
# board, never by CI.
qualification = []

[dependencies]
pulp = "0.22"
rayon = "1.10"
safetensors = "0.8"

[dependencies.gemm]
version = "0.19"
optional = true
default-features = false
features = ["std", "rayon"]

[dependencies.half]
version = "2"
optional = true
features = ["bytemuck"]

[dependencies.bytemuck]
version = "1"
optional = true
features = ["derive"]

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.clap]
version = "4"
optional = true
features = ["derive"]

[dependencies.tokenizers]
version = "0.23"
optional = true

[dependencies.hf-hub]
version = "1"
optional = true
features = ["blocking"]


# PDEATHSIG on supervisor-spawned rank children: a dead supervisor must
# not orphan a half-world that keeps training (dist bootstrap, Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dependencies.cudarc]
# 0.19.9 floor: SyncOnDrop teardown gated behind is_managing_stream_
# synchronization (PR 591) — the correct-drop story for our disabled
# per-slice event tracking (the CUDA Graph capture prerequisite).
version = "0.19.9"
optional = true
default-features = false
features = [
    "std",
    "cublas",
    "curand",
    "driver",
    "runtime",
    "nvrtc",
    "fallback-dynamic-loading",
    "cuda-version-from-build-system",
]

