[package]
name = "mamba-rs"
version = "0.6.7"
edition = "2024"
rust-version = "1.97"
authors = ["silvermpx"]
description = "Mamba SSM and Mamba-3 SISO in Rust with optional CUDA GPU acceleration. Inference and training (BPTT through SSM state, AdamW), CPU + GPU paths, custom CUDA kernels, CUDA Graph capture, f32 / bf16 / f16. Opt-in deterministic training (bit-identical runs, batch-invariant inference) with a tensor-core tier that beats cuBLAS on LLM-sized models."
homepage = "https://github.com/silvermpx/mamba-rs"
documentation = "https://docs.rs/mamba-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/silvermpx/mamba-rs"
keywords = ["mamba", "ssm", "deep-learning", "cuda", "state-space-model"]
categories = ["science", "mathematics"]
readme = "README.md"

# docs.rs builds have no CUDA toolkit -- render the CPU-side API surface
# (hf loaders, BLAS-backed GEMM, the CLI types). The cuda feature's docs
# render locally; doc(cfg) badge plumbing is a planned follow-up.
[package.metadata.docs.rs]
features = ["hf", "gemm-blas", "cli"]
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "mamba-generate"
path = "src/bin/generate.rs"
required-features = ["cli"]

[features]
default = []
# half + bytemuck are needed by the cuda buffers (DtypedBuf bf16/f16 cast
# helpers); they must be in scope for `cargo build --features cuda` alone.
cuda = ["cudarc", "dep:half", "dep:bytemuck"]
# Distributed data-parallel over NCCL. The cudarc NCCL binding is pinned
# to one wire version explicitly; the crate-and-libnccl pair must move
# together (the same discipline as any native-library pair).
nccl = ["cuda", "cudarc/nccl-02030"]
accelerate = []
gemm-blas = ["gemm"]
hf = ["dep:half", "dep:bytemuck", "dep:serde", "dep:serde_json"]
cli = ["hf", "dep:clap", "dep:tokenizers", "dep:hf-hub"]

[dependencies]
pulp = "0.22"
rayon = "1.10"
safetensors = "0.8"

[dependencies.gemm]
version = "0.19"
optional = true
default-features = false
features = ["std", "rayon"]

[dependencies.half]
version = "2"
optional = true
features = ["bytemuck"]

[dependencies.bytemuck]
version = "1"
optional = true
features = ["derive"]

[dependencies.serde]
version = "1"
optional = true
features = ["derive"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.clap]
version = "4"
optional = true
features = ["derive"]

[dependencies.tokenizers]
version = "0.23"
optional = true

[dependencies.hf-hub]
version = "1"
optional = true
features = ["blocking"]


# PDEATHSIG on supervisor-spawned rank children: a dead supervisor must
# not orphan a half-world that keeps training (dist bootstrap, Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[dependencies.cudarc]
# 0.19.9 floor: SyncOnDrop teardown gated behind is_managing_stream_
# synchronization (PR 591) — the correct-drop story for our disabled
# per-slice event tracking (the CUDA Graph capture prerequisite).
version = "0.19.9"
optional = true
features = ["driver", "cublas", "nvrtc", "cuda-version-from-build-system"]