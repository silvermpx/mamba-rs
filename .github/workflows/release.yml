name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # Wait for CI to pass first
  ci-check:
    name: Verify CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      # The cuda-gated code is a large part of the crate and does not
      # compile under the checks above. Without these two lines a tag can
      # publish what ci.yml rejects - which is exactly how 0.6.8 shipped
      # with a lint error CI caught only after the crate was on crates.io.
      # Keep in lockstep with the `cuda` / `all-features` jobs in ci.yml.
      - name: Install CUDA toolkit (nvcc only, no driver)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nvidia-cuda-toolkit
          nvcc --version
      - run: cargo check --workspace --all-targets --features cuda
      - run: cargo check --workspace --all-targets --features cuda,hf,gemm-blas,nccl
      - uses: EmbarkStudios/cargo-deny-action@v2

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: ci-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"

      - name: Verify tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VERSION="v$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "$CARGO_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "$TAG"
